[project]
name = "g-scores-backend"
version = "1.0.0"
description = "G-Scores Web API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0,<0.120.0",
    "uvicorn[standard]>=0.28.0,<0.35.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.28,<2.1.0",
    "asyncpg>=0.29.0,<0.31.0",
    "alembic>=1.13.1,<1.15.0",
    "httpx>=0.27.0,<0.29.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "redis>=5.0.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
