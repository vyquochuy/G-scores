services:
  db:
    image: postgres:16-alpine
    container_name: gscores-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-gscores}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-gscores}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: gscores-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gscores-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-gscores}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_TIMEOUT_SECONDS: 0.5
      BACKEND_CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://127.0.0.1:5173", "http://127.0.0.1:3000"]'
    volumes:
      - ./webdev-intern-assignment-3:/app/webdev-intern-assignment-3:ro
      - ./webdev-intern-assignment-3:/webdev-intern-assignment-3:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gscores-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
